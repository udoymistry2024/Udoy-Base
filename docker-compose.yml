services:
  db:
    image: postgres:15-alpine
    container_name: dataforge-db
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dataforge_secure_2026
      POSTGRES_DB: postgres
    volumes:
      - dataforge-pg-data:/var/lib/postgresql/data

volumes:
  dataforge-pg-data:
    name: dataforge-pg-data
